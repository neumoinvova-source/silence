name: Build Android APK

on:
  push:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-22.04

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            build-essential \
            cmake \
            git \
            unzip \
            zip \
            openjdk-17-jdk \
            libstdc++6 \
            aidl \
            libgtk-3-0 \
            autoconf \
            libtool \
            pkg-config

          python -m pip install --upgrade pip
          python -m pip install buildozer cython==0.29.36 virtualenv

      - name: Build APK
        env:
          BUILDOZER_ALLOW_ROOT: '1'
          ANDROID_AUTO_ACCEPT_SDK_LICENSES: '1'
        run: |
          # 1. Принудительное одобрение лицензий
          mkdir -p ~/.android && touch ~/.android/repositories.cfg
          if [ -d "$ANDROID_HOME/cmdline-tools/latest/bin" ]; then
            yes | $ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager --licenses || true
          elif [ -d "$ANDROID_HOME/tools/bin" ]; then
            yes | $ANDROID_HOME/tools/bin/sdkmanager --licenses || true
          fi
          
          # 2. Безопасное создание идеального buildozer.spec в одну строку без проблем с отступами
          echo -e "[app]\ntitle = My Application\npackage.name = myapp\npackage.domain = org.test\nsource.dir = .\nversion = 0.1\nrequirements = python3,kivy\nandroid.accept_sdk_license = True" > buildozer.spec
          
          # 3. Подкидываем aidl в пути сборки
          mkdir -p ~/.buildozer/android/platform/android-sdk/build-tools/34.0.0
          ln -sf /usr/bin/aidl ~/.buildozer/android/platform/android-sdk/build-tools/34.0.0/aidl
          
          # 4. Запуск сборки
          buildozer android debug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: silence-apk
          path: bin/*.apk
