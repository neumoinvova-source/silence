name: Build Android APK
on: [push, workflow_dispatch]

jobs:
  build:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Install Android Dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            build-essential ccache cmake cpio docutils-common \
            execstack g++ gcc git libffi-dev libgtk-3-dev \
            libgstreamer1.0-dev libgstreamer-plugins-base1.0-dev \
            libjpeg-dev libltdl-dev libposix-pregcomp-perl \
            libsdl2-dev libsdl2-image-dev libsdl2-mix-dev \
            libsdl2-ttf-dev libsqlite3-dev libssl-dev libxml2-dev \
            libxslt1-dev lld locales openjdk-17-jdk patch \
            pkg-config python3-dev python3-setuptools unzip zlib1g-dev
          pip install --upgrade pip
          pip install buildozer cython virtualenv kivy requests

      - name: Build with Buildozer (Force Root)
        run: |
          export BUILDOZER_ALLOW_ROOT=1
          yes | buildozer android debug

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: package
          path: bin/*.apk
