name: Build Android APK

on:
  push:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-22.04

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            build-essential \
            cmake \
            git \
            unzip \
            zip \
            openjdk-17-jdk \
            libstdc++6 \
            aidl

          python -m pip install --upgrade pip
          python -m pip install buildozer cython==0.29.36 virtualenv

      - name: Build APK
        env:
          BUILDOZER_ALLOW_ROOT: '1'
        run: |
          # Принудительно соглашаемся со всеми лицензиями Android SDK перед сборкой
          mkdir -p ~/.android && touch ~/.android/repositories.cfg
          yes | $ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager --licenses || true
          yes | $ANDROID_HOME/tools/bin/sdkmanager --licenses || true
          
          # Создаем пути для Android SDK заранее и подкидываем системный aidl, чтобы Buildozer его точно нашел
          mkdir -p ~/.buildozer/android/platform/android-sdk/build-tools/34.0.0
          ln -sf /usr/bin/aidl ~/.buildozer/android/platform/android-sdk/build-tools/34.0.0/aidl
          
          # Запуск сборки Buildozer
          buildozer android debug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: silence-apk
          path: bin/*.apk
